<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <path d="M50 10 L80 25 L80 75 L50 90 L20 75 L20 25 Z" fill="none" stroke="url(#logo-grad)" stroke-width="4" filter="url(#glow)" />
  <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="28" font-weight="bold" fill="white" filter="url(#glow)">OS</text>
</svg>
